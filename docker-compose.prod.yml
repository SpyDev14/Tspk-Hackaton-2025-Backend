# Maked by
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: $psql_user
      POSTGRES_PASSWORD: $psql_pass
      POSTGRES_DB: $psql_host
    networks:
      - web_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    entrypoint: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic && gunicorn main.wsgi:application --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - web_network

volumes:
  postgres_data:

networks:
  web_network:
    driver: bridge
